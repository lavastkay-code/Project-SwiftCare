<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftCare - Welcome</title>

  <link rel="stylesheet" href="css/onBoarding.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>

<body>

  <div class="page-wrapper">
    <header class="topbar">

      <div class="logo">
        <img src="image/logo-2.png" alt="SwiftCare Logo" />
      </div>

      <nav class="nav-links">
        <a href="#">Appointments</a>
        <span class="separator">|</span>

        <a href="#">Billing</a>
        <span class="separator">|</span>

        <a href="#">FAQ</a>

        <button class="search-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </nav>

      <div class="topbar-right">

        <a href="#" class="contact-link">Contact</a>

        <i class="fa-solid fa-globe"></i>

        <div class="profile-box">
          <i class="fa-solid fa-bars"></i>
          <i class="fa-solid fa-user"></i>
        </div>

      </div>

    </header>
    <section class="hero-section">

      <div class="hero-content">

        <div class="circle-decoration"></div>

        <h1>Let's set up your clinic workspace</h1>

        <p>Embracing Ease in a world full of stress</p>

        <div class="hero-buttons">
          <a href="signup.html" class="btn btn-primary">
            Sign Up as Admin
          </a>

          <a href="login.html" class="btn btn-success">
            Login
          </a>
        </div>

      </div>

      <div class="hero-image">
        <img src="image/Medical-kit.png" alt="Medical Illustration" />
      </div>

    </section>

    <section class="building-section">

      <div class="privacy-box">

        <i class="fa-solid fa-lock"></i>

        <div>
          <strong>Your information is safe with us</strong>
          <small>We never share your data</small>
        </div>

      </div>

    </section>

  </div>

</body>
</html>
